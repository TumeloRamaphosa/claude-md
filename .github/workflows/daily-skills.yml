name: Daily Studex skill discovery
on:
  schedule:
    - cron: '0 5 * * *' # 07:00 SAST (UTC+2)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-studex-skills
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test discovery invariants
        run: python3 -m unittest discover -s tests -v
      - name: Find candidates and draft skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_skills.py
      - name: Preserve report and drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studex-skill-discovery-${{ github.run_id }}
          path: skill-discovery/
          if-no-files-found: ignore
      - name: Commit generated drafts only
        run: |
          git config user.name 'Studex Skill Scout'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill-discovery/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh daily skill discovery drafts'
          git pull --rebase origin main
          git push origin HEAD:main
